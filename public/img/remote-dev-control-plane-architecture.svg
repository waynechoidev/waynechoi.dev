<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Persistent AI development control plane architecture</title>
  <desc id="description">Desktop and mobile browsers connect to a server-owned control plane. The control plane manages scoped streams, durable SQLite state, runtime coordination, provider adapters, and development processes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .heading { font: 700 28px system-ui, sans-serif; fill: #172554; }
      .label { font: 650 21px system-ui, sans-serif; fill: #1e293b; }
      .small { font: 500 17px system-ui, sans-serif; fill: #475569; }
      .tiny { font: 500 15px system-ui, sans-serif; fill: #64748b; }
      .line { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect width="1200" height="700" rx="24" fill="url(#background)"/>
  <text x="600" y="54" text-anchor="middle" class="heading">Server-owned state, browser-based control</text>

  <rect x="55" y="120" width="245" height="185" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
  <text x="177" y="158" text-anchor="middle" class="label">Browsers</text>
  <rect x="86" y="182" width="180" height="42" rx="10" fill="#dbeafe"/>
  <text x="176" y="209" text-anchor="middle" class="small">Desktop / laptop</text>
  <rect x="86" y="239" width="180" height="42" rx="10" fill="#dbeafe"/>
  <text x="176" y="266" text-anchor="middle" class="small">Tablet / mobile</text>

  <rect x="410" y="90" width="420" height="510" rx="22" fill="#ffffff" stroke="#6366f1" stroke-width="4"/>
  <text x="620" y="132" text-anchor="middle" class="label">Development control plane</text>
  <text x="620" y="160" text-anchor="middle" class="tiny">authoritative identity, authorization, and lifecycle</text>

  <rect x="460" y="200" width="320" height="78" rx="14" fill="#e0e7ff"/>
  <text x="620" y="232" text-anchor="middle" class="label">Scoped API + streams</text>
  <text x="620" y="260" text-anchor="middle" class="small">snapshot + WebSocket events</text>

  <rect x="460" y="310" width="145" height="105" rx="14" fill="#ede9fe"/>
  <text x="532" y="345" text-anchor="middle" class="label">SQLite</text>
  <text x="532" y="374" text-anchor="middle" class="small">durable intent</text>
  <text x="532" y="399" text-anchor="middle" class="small">event history</text>

  <rect x="635" y="310" width="145" height="105" rx="14" fill="#ede9fe"/>
  <text x="707" y="345" text-anchor="middle" class="label">Coordinator</text>
  <text x="707" y="374" text-anchor="middle" class="small">observed state</text>
  <text x="707" y="399" text-anchor="middle" class="small">reconciliation</text>

  <rect x="460" y="455" width="320" height="95" rx="14" fill="#f3e8ff"/>
  <text x="620" y="491" text-anchor="middle" class="label">Provider adapters</text>
  <text x="620" y="521" text-anchor="middle" class="small">normalized conversation events</text>

  <rect x="930" y="120" width="220" height="405" rx="18" fill="#ffffff" stroke="#34d399" stroke-width="3"/>
  <text x="1040" y="158" text-anchor="middle" class="label">Runtimes</text>
  <rect x="960" y="186" width="160" height="62" rx="12" fill="#d1fae5"/>
  <text x="1040" y="213" text-anchor="middle" class="small">Agent sessions</text>
  <text x="1040" y="236" text-anchor="middle" class="tiny">external processes</text>
  <rect x="960" y="270" width="160" height="62" rx="12" fill="#d1fae5"/>
  <text x="1040" y="297" text-anchor="middle" class="small">Terminals</text>
  <text x="1040" y="320" text-anchor="middle" class="tiny">long-running work</text>
  <rect x="960" y="354" width="160" height="62" rx="12" fill="#d1fae5"/>
  <text x="1040" y="381" text-anchor="middle" class="small">Git + files</text>
  <text x="1040" y="404" text-anchor="middle" class="tiny">bounded access</text>
  <rect x="960" y="438" width="160" height="62" rx="12" fill="#d1fae5"/>
  <text x="1040" y="465" text-anchor="middle" class="small">Speech services</text>
  <text x="1040" y="488" text-anchor="middle" class="tiny">STT / TTS</text>

  <path d="M300 212 H410" class="line"/>
  <text x="355" y="193" text-anchor="middle" class="tiny">commands</text>
  <path d="M410 260 H300" class="line dash"/>
  <text x="355" y="286" text-anchor="middle" class="tiny">observations</text>

  <path d="M830 232 H930" class="line"/>
  <text x="880" y="213" text-anchor="middle" class="tiny">control</text>
  <path d="M930 282 H830" class="line dash"/>
  <text x="880" y="307" text-anchor="middle" class="tiny">runtime state</text>

  <path d="M620 278 V305" class="line"/>
  <path d="M532 415 V450" class="line"/>
  <path d="M707 415 V450" class="line"/>

  <text x="600" y="657" text-anchor="middle" class="small">Disconnecting a browser removes a subscription—not the underlying work.</text>
</svg>
